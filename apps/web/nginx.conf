# The dashboard and the API are served from a SINGLE origin: this config
# reverse-proxies /v1 and /health to the api container. Two consequences:
#   1. the browser never issues a cross-origin request, so the API needs no
#      CORS entry for the public domain, and
#   2. only one domain has to be configured in Dokploy.
#
# Docker's embedded DNS resolves the `api` service name and container IPs
# change across restarts, hence `resolver` + a variable in `proxy_pass`
# instead of a static upstream: nginx then re-resolves at request time and
# never caches a stale IP (or refuses to boot when `api` is briefly absent).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Character models: large binaries that only change with a new build.
  location /models/ {
    expires 30d;
    add_header Cache-Control "public";
  }

  # REST API + WebSocket stream. $request_uri carries the original path and
  # query string, which is what GET /v1/stream?since=<id> needs.
  location /v1/ {
    set $api http://api:3000;
    proxy_pass $api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade, used only by /v1/stream.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /health {
    set $api http://api:3000;
    proxy_pass $api/health;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
