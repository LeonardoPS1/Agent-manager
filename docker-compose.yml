services:
  postgres:
    image: postgres:16-alpine
    container_name: office-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: office
      POSTGRES_PASSWORD: office_dev
      POSTGRES_DB: office_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d office_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: office-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: office-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://office:office_dev@postgres:5432/office_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_prod_super_secret_key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Set to "true" to enforce per-agent bearer tokens on POST /v1/events
      OFFICE_REQUIRE_AUTH: ${OFFICE_REQUIRE_AUTH:-false}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    container_name: office-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  mcp-server:
    build:
      context: ./apps/mcp-server
      dockerfile: Dockerfile
    container_name: office-mcp
    restart: unless-stopped
    environment:
      OFFICE_API_URL: http://api:3000
      OFFICE_MCP_TOKEN: ${OFFICE_MCP_TOKEN:-change_me_mcp_token}
    depends_on:
      - api
    profiles:
      - mcp

volumes:
  postgres_data:
  redis_data:
